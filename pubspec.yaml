name: rts
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # Networking
  http: ^1.2.1
  
  # UI/UX & Utilities
  google_fonts: ^6.2.1
  intl: ^0.19.0
  file_picker: ^8.0.3
  dotted_border: ^2.1.0
  flutter_svg: ^2.0.10+1
  record: ^5.1.0
  audioplayers: ^6.0.0
  shared_preferences: ^2.2.3
  app_links: ^6.0.1
  flutter_dotenv: ^5.1.0
  url_launcher: ^6.3.0
  firebase_core: ^2.27.0
  firebase_messaging: ^14.9.4
  flutter_local_notifications: ^21.0.0
  path_provider: ^2.1.2
  permission_handler: ^11.3.1


dependency_overrides:
  record_platform_interface: 1.3.0
  record_linux: 1.2.0
  record_web: 1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/rtsLogo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/
    - .env
